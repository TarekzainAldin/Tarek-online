{% extends "layout.html" %}
{% block content %}

<div class="container">
    <div class="row">
        <div class="col-md-3"></div>
        <div class="col-md-6">

            {% include '_messages.html' %}

            {% if updatebrand %}
            <h2 class="text-center mt-5">Update Brand</h2>
            <form action="" method="post">
                <input type="text" name="brand" class="form-control" value="{{updatebrand.name}}" required>
                <input type="submit" value="Update Brand" class="btn btn-info mt-3">
            </form>
            {% else %}
            <h2 class="text-center mt-5">Add Category</h2>
            <form action="" method="post">
                <input type="text" class="form-control" name="category" placeholder="Enter Category Name" required>
                <input type="submit" class="btn btn-info mt-3" value="Add Category">
            </form>
            {% endif %}
        </div>
        <div class="col-md-3"></div>
    </div>
</div>

{% endblock content %}
