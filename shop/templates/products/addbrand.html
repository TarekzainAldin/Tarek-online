{% extends "layout_admin.html" %}
{% block content %}
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="/admin">ADMIN PANEL</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavDropdown">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item active">
            <a class="nav-link" href="/admin">Home <span class="sr-only">(current)</span></a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/brands">Brands</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/category">Categories</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownMenuLink" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
              Add Products
            </a>
            <div class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
               <a class="dropdown-item" href="{{url_for('addproduct')}}">Add product</a>
              <a class="dropdown-item" href="{{url_for('addbrand')}}">add brand</a>
              <a class="dropdown-item" href="{{url_for('addcat')}}">add category</a>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <!-- End Navbar -->qo
<div class="container">
    <div class="row">
        <div class="col-md-3"></div>
        <div class="col-md-6">
            
            {% include '_messages.html' %}

            {% if brands %}
            <h2 class="text-center mt-5">Add Brand</h2>
            <form action="" method="post">
                <input class="form-control" type="text" name="brand" placeholder="Enter Brand Name" required>
                <input type="submit" value="Add Brand" class="btn btn-info mt-3">
            </form>
            {% else %}
            <h2 class="text-center mt-5">Add Category</h2>
            <form action="" method="post">
                <input type="text" class="form-control" name="category" placeholder="Enter Category Name" required>
                <input type="submit" class="btn btn-info mt-3" value="Add Category">
            </form>
            {% endif %}
        </div>
        <div class="col-md-3"></div>
    </div>
</div>

{% endblock content %}
