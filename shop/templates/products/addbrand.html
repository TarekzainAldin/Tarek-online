{% extends "layout_admin.html" %}
{% block content %}

<div class="container">
    <div class="row">
        <div class="col-md-3"></div>
        <div class="col-md-6">
            
            {% include '_messages.html' %}

            {% if brands %}
            <h2 class="text-center mt-5">Add Brand</h2>
            <form action="" method="post">
                <input class="form-control" type="text" name="brand" placeholder="Enter Brand Name" required>
                <input type="submit" value="Add Brand" class="btn btn-info mt-3">
            </form>
            {% else %}
            <h2 class="text-center mt-5">Add Category</h2>
            <form action="" method="post">
                <input type="text" class="form-control" name="category" placeholder="Enter Category Name" required>
                <input type="submit" class="btn btn-info mt-3" value="Add Category">
            </form>
            {% endif %}
        </div>
        <div class="col-md-3"></div>
    </div>
</div>

{% endblock content %}
