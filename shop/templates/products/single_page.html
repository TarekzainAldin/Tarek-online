{% extends 'layout.html' %}
{% block content %}

<div class="container py-5">
    <div class="row g-5">
        <!-- Main Image -->
        <div class="col-lg-6">
            <div id="b_image" class="border rounded p-3 text-center">
                <img src="{{ url_for('static', filename='images/' + product.image_1) }}" alt="{{ product.name }}" class="img-fluid rounded" id="mainProductImage">
            </div>
            <!-- Thumbnails -->
            <div class="d-flex justify-content-center gap-3 mt-3" id="s_image">
                <img src="{{ url_for('static', filename='images/' + product.image_1) }}" alt="{{ product.name }}" class="img-thumbnail thumb" width="100">
                <img src="{{ url_for('static', filename='images/' + product.image_2) }}" alt="{{ product.name }}" class="img-thumbnail thumb" width="100">
                <img src="{{ url_for('static', filename='images/' + product.image_3) }}" alt="{{ product.name }}" class="img-thumbnail thumb" width="100">
            </div>
        </div>

        <!-- Product Details -->
        <div class="col-lg-6">
            <h2 class="fw-bold">{{ product.name }}</h2>
            <p class="text-muted fs-5">Price: <span class="text-success">${{ product.price }}</span></p>
            {% if product.discount > 0 %}
                <p class="badge bg-danger fs-6">Discount: {{ product.discount }}%</p>
            {% endif %}
            <hr>
            <h5>Description</h5>
            <p>{{ product.desc }}</p>

            <!-- Add to Cart Form -->
            <form action="{{ url_for('AddCart') }}" method="post" class="mt-4">
                <input type="hidden" name="product_id" value="{{ product.id }}">
                
                <div class="mb-3">
                    <label for="quantity" class="form-label">Quantity</label>
                    <input type="number" class="form-control w-50" name="quantity" value="1" min="1" max="{{ product.stock }}">
                </div>

                <div class="mb-3">
                    <label for="colors" class="form-label">Choose Color</label>
                    <select class="form-select w-50" name="colors" id="colors">
                        {% for color in product.colors.split(',') %}
                            {% set col = color.split(':') %}
                            <option value="{{ col[0] }}">{{ col[0] | capitalize }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="btn btn-warning btn-lg mt-3">Add to Cart</button>
            </form>
        </div>
    </div>
</div>

<script>
    document.querySelectorAll('#s_image .thumb').forEach(img => {
        img.addEventListener('click', () => {
            document.getElementById('mainProductImage').src = img.src;
        });
    });
</script>

{% endblock content %}
